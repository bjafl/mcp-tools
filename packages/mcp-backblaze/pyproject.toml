[project]
name = "mcp-backblaze"
version = "0.1.0"
description = "MCP server for Backblaze B2 Cloud Storage (buckets, file listing, upload/download)"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.0.0,<3",
    "httpx>=0.27,<0.29",
    "pydantic>=2,<3",
]

[project.scripts]
mcp-backblaze = "mcp_backblaze:main"

[build-system]
requires = ["uv_build>=0.11.13,<0.12"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_backblaze"]

[dependency-groups]
dev = ["pytest>=8,<9"]
