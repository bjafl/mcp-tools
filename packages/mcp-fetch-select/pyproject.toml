[project]
name = "mcp-fetch-select"
version = "0.1.0"
description = "MCP server that fetches a URL and returns elements matching a CSS selector"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.0.0,<3",
    "httpx>=0.27,<0.29",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.0,<7",
    "pydantic>=2,<3",
]

[project.scripts]
mcp-fetch-select = "mcp_fetch_select:main"


[build-system]
requires = ["uv_build>=0.11.13,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8,<9"]